<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mirzabenevis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="popup">
    <header class="titlebar" data-tauri-drag-region>
      <span class="title" data-tauri-drag-region>mirzabenevis</span>
      <span id="modeTag" data-tauri-drag-region></span>
      <span class="grip" data-tauri-drag-region></span>
      <span class="title fa" lang="fa" dir="rtl" data-tauri-drag-region>میرزابنویس</span>
      <button id="menuBtn" type="button" title="Menu" aria-label="Menu" aria-haspopup="menu">☰</button>
      <button id="closeBtn" type="button" title="Close (Esc)" aria-label="Close">×</button>
    </header>
    <section class="pane original">
      <div class="label">Original <span><button class="lbtn" id="pasteBtn" type="button" title="Replace the text with the clipboard">Paste</button><button class="lbtn" id="clearBtn" type="button" title="Clear the text">Clear</button> <kbd>E</kbd> edit</span></div>
      <textarea id="original" rows="2" spellcheck="false" aria-label="Original text"
        placeholder="Nothing selected. Press E, then paste or type text here."></textarea>
    </section>

    <header class="bar" data-tauri-drag-region>
      <nav class="actions" id="actions" aria-label="Actions"></nav>
      <form id="promptForm">
        <input id="prompt" type="text" dir="auto" list="recents" spellcheck="false" aria-label="Custom instruction" />
        <datalist id="recents"></datalist>
        <button id="star" type="button" title="Save this instruction as a button"
          aria-label="Save this instruction as a button">★</button>
      </form>
      <nav class="actions modifiers" id="modifiers" aria-label="Modifiers for the next run"></nav>
      <input id="context" type="text" dir="auto" spellcheck="false" hidden aria-label="Context for every run today"
        placeholder="Context for every run today, e.g. reply to my PI, keep it short (Esc back)" />
    </header>

    <section class="pane result">
      <div class="label"><span id="resultTitle">Result</span> <span id="resultName"></span> <span id="resultKeys"><kbd>X</kbd> changes <kbd>D</kbd> diff</span></div>
      <div class="result-text" id="result" tabindex="0" role="region" aria-label="Result" aria-live="polite"></div>
    </section>

    <section class="pane explain" id="explainPane" hidden>
      <div class="label"><span>What changed</span> <span><kbd>X</kbd> hide</span></div>
      <div class="result-text md" id="explain" tabindex="0" role="region" aria-label="What changed" aria-live="polite"></div>
    </section>

      <div id="chipMenu" class="menu" role="menu" hidden></div>

  <footer class="hint">
      <button class="backend" id="backend" type="button" aria-haspopup="dialog" aria-keyshortcuts="m">…</button>
      <span id="status" role="status"></span>
      <span class="keys">
        <span id="enterKey"><kbd>Enter</kbd> <span id="enterHint">Run</span></span>
        <kbd>C</kbd> Copy
        <kbd>R</kbd> Redo
        <kbd>P</kbd> <span id="pin">pinned</span>
        <kbd>Esc</kbd> <span id="escHint">Close</span>
      </span>
    </footer>
  </main>
  <dialog id="picker" aria-label="AI backend">
    <div id="pickerList"></div>
    <p class="picker-hint">↑↓ Enter choose · type a model, Enter saves · Esc close</p>
  </dialog>
  <dialog id="settings" aria-label="Settings">
    <div class="settings">
      <div id="setTabs" class="set-tabs" role="tablist" aria-orientation="vertical" aria-label="Settings sections"></div>
      <div id="setPane" class="set-pane" role="tabpanel"></div>
    </div>
    <p class="picker-hint"><span id="setStatus" role="status"></span> Changes are saved to config.toml as you make them · Esc close</p>
  </dialog>
  <dialog id="about" aria-label="About">
    <div class="result-text md" id="aboutText"></div>
    <p class="picker-hint">Esc close</p>
  </dialog>
  <script src="diff.js"></script>
  <script src="md.js"></script>
  <script src="main.js"></script>
</body>
</html>
