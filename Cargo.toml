[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "src-tauri"]
# `cargo check` / `cargo run` default to the headless crates; the Tauri app
# needs webkitgtk and friends (see flake.nix), build it with `cargo tauri dev`.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/ehsanirani/mirzabenevis"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
directories = "5"
arboard = { version = "3", features = ["wayland-data-control"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
